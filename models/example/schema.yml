
version: 2

models:
    - name: macro_calling
      description: "clkling the macro_calling.sql model"
      columns:
          - name: ORDER_ID
            description: "The primary key for this table"
            tests:
                - unique
                - not_null
          
          - name: ORDER_STATUS
            description: "The Status column should hold only these ['PENDING', 'SHIPPED', 'DELIVERED', 'CANCELLED']"
            tests:
                - accepted_values:
                   arguments: 
                    values: ['PENDING', 'SHIPPED', 'DELIVERED', 'CANCELLED']

